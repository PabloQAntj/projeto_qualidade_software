name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure Docker is available
        run: |
          sudo systemctl start docker
          docker info

      - name: Verify
        env:
          api.version: '1.40'
        run: ./mvnw -B verify

      - name: Run Node tests
        run: node --test tests/*.test.js

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=WesMarquess_projeto_qualidade_software \
            -Dsonar.projectKey=WesMarquess_projeto_qualidade_software \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
